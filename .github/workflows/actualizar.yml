# Actualiza las predicciones en los servidores gratuitos de GitHub y publica la página privada (cifrada).
# - Se intenta cada 15 minutos (GitHub suele retrasar o saltarse corridas programadas).
# - Si la última actualización completa tiene 45 minutos o más: actualización completa.
#   Si es más reciente: revisión rápida de alineaciones confirmadas.
# - Desde la página, el botón «Actualizar ahora» lanza una completa al momento (workflow_dispatch).
# Los datos descargados se guardan entre corridas en la caché de GitHub (no en el repositorio público).
name: Actualizar predicciones

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Lima
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install numpy cryptography

      - name: Recuperar datos de la corrida anterior
        uses: actions/cache/restore@v4
        with:
          path: datos
          key: datos-v1-${{ github.run_id }}
          restore-keys: datos-v1-

      - name: Actualizar predicciones
        id: modo
        run: |
          # ¿Completa o rápida? Antes se decidía por el minuto del reloj, pero GitHub retrasa las corridas
          # programadas y casi todas caían en «rápida»: la página pasaba horas sin actualizarse de verdad.
          # Ahora se mira la EDAD de los datos: si la última completa tiene 45 minutos o más, toca completa.
          EDAD=$(python -c "
          import json, datetime as dt
          try:
              g = json.load(open('datos/predicciones.json', encoding='utf-8'))['generado']
              print(int((dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(g)).total_seconds() // 60))
          except Exception:
              print(99999)
          ")
          echo "Minutos desde la última actualización completa: $EDAD"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$EDAD" -ge 45 ]; then
            echo "completa=si" >> "$GITHUB_OUTPUT"
            python actualizar.py || echo "::warning::La actualización completa terminó con error"
          else
            echo "completa=no" >> "$GITHUB_OUTPUT"
            python actualizar.py --rapido || echo "::warning::La revisión rápida terminó con error"
          fi

      - name: Guardar datos para la próxima corrida
        if: steps.modo.outputs.completa == 'si' && hashFiles('datos/predicciones.json') != ''
        uses: actions/cache/save@v4
        with:
          path: datos
          key: datos-v1-${{ github.run_id }}

      - name: Armar la página cifrada
        env:
          CLAVE_PAGINA: ${{ secrets.CLAVE_PAGINA }}
        run: python publicar_web.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: publicar
        uses: actions/deploy-pages@v4
